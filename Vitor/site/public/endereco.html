<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetria | Cadastro de Endereço</title>
    <link rel="stylesheet" href="css/endereco.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="main-wrapper">
        <div class="cadastro-container">

            <div class="header">
                <a href="index.html">
                    <img src="assets/tetria-logo-transparente.png" alt="Logo Tetria" style="max-height: 40px; margin-bottom: 10px;">
                </a>
                <h1>Localização do Apiário</h1>
                <span>Passo 3 de 3: Endereço da instalação ou empresa</span>
            </div>

            <form id="form-endereco" onsubmit="event.preventDefault(); concluirCadastro();">
                <div class="input-group">
                    <label for="cep">CEP</label>
                    <input type="text" id="cep" placeholder="00000-000" required>
                </div>
                <div class="input-group">
                    <label for="rua">Logradouro / Rua</label>
                    <input type="text" id="rua" placeholder="Estrada, Rua ou Avenida" required>
                </div>
                <div class="input-group">
                    <label for="numero">Número</label>
                    <input type="text" id="numero" placeholder="Ex: 123 ou km 12" required>
                </div>
                <div class="input-group">
                    <label for="complemento">Complemento / Apiário</label>
                    <input type="text" id="complemento" placeholder="Ex: Sítio São José, Bloco A" required>
                </div>
                <div class="input-group">
                    <label for="bairro">Bairro</label>
                    <input type="text" id="bairro" placeholder="Digite o bairro ou zona rural" required>
                </div>
                <div class="input-group">
                    <label for="cidade">Cidade</label>
                    <input type="text" id="cidade" placeholder="Sua cidade" required>
                </div>
                <div class="input-group">
                    <label for="estado">Estado (UF)</label>
                    <input type="text" id="estado" placeholder="Ex: SP" maxlength="2" required>
                </div>

                <div class="btn" style="margin-top: 15px;">
                    <button type="submit" id="btn_concluir">Finalizar Cadastro</button>
                </div>
            </form>

        </div>
    </div>

    <script>
        function concluirCadastro() {
            let cepVar = cep.value;
            let ruaVar = rua.value;
            let numeroVar = numero.value;
            let complementoVar = complemento.value;
            let bairroVar = bairro.value;
            let cidadeVar = cidade.value;
            let estadoVar = estado.value.toUpperCase();
            let codEmpresa = sessionStorage.CADASTRO_COD_EMPRESA;

            if (cepVar == "" || ruaVar == "" || numeroVar == "" || complementoVar == "" || bairroVar == "" || cidadeVar == "" || estadoVar == "") {
                alert("Por favor, preencha todos os campos do endereço!");
            } else if (codEmpresa == undefined || sessionStorage.CADASTRO_EMAIL == undefined) {
                alert("Faltam dados dos passos anteriores, comece o cadastro de novo!");
                window.location = "cadastro.html";
            } else {
                btn_concluir.disabled = true;

                fetch("/usuarios/cadastrarenderco", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        cepServer: cepVar,
                        ruaServer: ruaVar,
                        numeroServer: numeroVar,
                        complementoServer: complementoVar,
                        bairroServer: bairroVar,
                        cidadeServer: cidadeVar,
                        estadoServer: estadoVar,
                        fkEnderecoEmpresa: codEmpresa
                    })
                })
                    .then(function (resposta) {
                        if (resposta.ok) {
                            cadastrarUsuario(codEmpresa);
                        } else {
                            btn_concluir.disabled = false;
                            resposta.json().then(function (dados) {
                                alert(dados.erro);
                            });
                        }
                    })
                    .catch(function (erro) {
                        console.log(erro);
                        btn_concluir.disabled = false;
                        alert("Não foi possível conectar com o servidor!");
                    });
            }
        }

        function cadastrarUsuario(codEmpresa) {
            fetch("/usuarios/cadastrar", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    nomeServer: sessionStorage.CADASTRO_NOME,
                    emailServer: sessionStorage.CADASTRO_EMAIL,
                    senhaServer: sessionStorage.CADASTRO_SENHA,
                    cpfServer: sessionStorage.CADASTRO_CPF,
                    telefoneServer: sessionStorage.CADASTRO_TELEFONE,
                    fkEmpresaServer: codEmpresa
                })
            })
                .then(function (resposta) {
                    if (resposta.ok) {
                        sessionStorage.clear();
                        alert("Cadastro concluído! Faça o login.");
                        window.location = "login.html";
                    } else {
                        btn_concluir.disabled = false;
                        resposta.json().then(function (dados) {
                            alert(dados.erro);
                        });
                    }
                })
                .catch(function (erro) {
                    console.log(erro);
                    btn_concluir.disabled = false;
                    alert("Não foi possível conectar com o servidor!");
                });
        }
    </script>
</body>
</html>
