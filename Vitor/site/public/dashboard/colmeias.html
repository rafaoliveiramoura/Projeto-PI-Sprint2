<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Tetria | Colmeias</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="cssdash/colmeias.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
        <img class="logo" src="src/logo-tetria-icone.png" alt="Logo Tetria" />
        <div>
          <h1>TETRIA</h1>
          <p>Monitoramento de colmeias</p>
        </div>
      </div>
        <nav>
        <a id="nav_dashboard" class="nav-link" href="dashboard.html"><svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg><span>Dashboard</span></a>
        <a id="nav_colmeias" class="nav-link active" href="colmeias.html"><svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.5l8.5 4.75v9.5L12 21.5l-8.5-4.75v-9.5z"/></svg><span>Colmeias</span></a>
        <a id="nav_mel" class="nav-link" href="historico-mel.html"><svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 11h10v8a3 3 0 0 1-3 3h-4a3 3 0 0 1-3-3v-8z"/><path d="M6 7h12v4H6z"/><path d="M9 3h6v4H9z"/><path d="M12 14v4"/></svg><span>Histórico do Mel</span></a>
        <a id="nav_configuracoes" class="nav-link" href="configuracoes.html"><svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg><span>Configurações</span></a>
      </nav>

        <div class="side-foot"></div>
        <a class="nav-link logout-link" href="../index.html" onclick="sessionStorage.clear()">
          <svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          <span>Sair</span>
        </a>
      </aside>

      <main class="main">
        <header class="topbar">
          <div class="title-line">
            <h2 id="titulo_pagina">Monitoramento das colmeias</h2>
          </div>

          <div class="top-actions">
            <div class="avatar">T</div>
          </div>
        </header>

        <article class="card tabela-dashboard-card">
          <div class="tabela-dashboard-topo">
            <div>
              <h2>Leituras atuais por colmeia</h2>
            </div>
            <div class="filtro-rapido-tabela">
              <label for="select_filtro">Situação</label>
              <select id="select_filtro" onchange="filtrarTabelaDashboard()">
                <option value="todas">Todas as colmeias</option>
                <option value="Risco">Em risco</option>
                <option value="Atenção">Em atenção</option>
                <option value="Ideal">Ideais</option>
              </select>
              <button
                type="button"
                class="botao-reset-filtro"
                onclick="resetarFiltroDashboard()"
                title="Mostrar todas as colmeias"
              >
                Limpar filtro
              </button>
            </div>
          </div>

          <div class="tabela-container">
            <table class="tabela-dashboard">
              <thead>
                <tr>
                  <th>Colmeia</th>
                  <th>Status Geral</th>
                  <th>Temp. Atual</th>
                  <th>Comparação Temperatura</th>
                  <th>Umidade Atual</th>
                  <th>Comparação Umidade</th>
                </tr>
              </thead>
              <tbody id="listaTabelaDashboard">
              </tbody>
            </table>
          </div>
        </article>
      </main>
    </div>


    <script>
      let idEndereco = sessionStorage.ID_ENDERECO;

      if (idEndereco == undefined) {
        idEndereco = 1;
      }

      let tempMin = 33;
      let tempMax = 36;
      let tempFrio = 32;
      let tempCalor = 38;
      let umidMin = 50;
      let umidMax = 75;
      let umidSeca = 40;
      let umidRisco = 85;

      function numeroBonito(numero) {
        return numero.toFixed(1).replace(".", ",").replace(",0", "");
      }

      function comparar(valor, minimo, maximo, limiteBaixo, limiteAlto, unidade) {
        if (valor < limiteBaixo) {
          return `<span class="tag-comparacao comp-vermelho">▼ Crítica · ${numeroBonito(minimo - valor)}${unidade} abaixo</span>`;
        } else if (valor > limiteAlto) {
          return `<span class="tag-comparacao comp-vermelho">▲ Crítica · ${numeroBonito(valor - maximo)}${unidade} acima</span>`;
        } else if (valor < minimo) {
          return `<span class="tag-comparacao comp-amarelo">▼ Atenção · ${numeroBonito(minimo - valor)}${unidade} abaixo</span>`;
        } else if (valor > maximo) {
          return `<span class="tag-comparacao comp-amarelo">▲ Atenção · ${numeroBonito(valor - maximo)}${unidade} acima</span>`;
        } else {
          return `<span class="tag-comparacao comp-verde">Na faixa · ${numeroBonito(minimo)}–${numeroBonito(maximo)}${unidade}</span>`;
        }
      }

      function buscarConfig() {
        fetch(`/dashboard/config/${idEndereco}`)
          .then(function (resposta) {
            if (resposta.status == 200) {
              resposta.json().then(function (config) {
                tempMin = Number(config.temp_min_ideal);
                tempMax = Number(config.temp_max_ideal);
                tempFrio = Number(config.temp_alerta_frio);
                tempCalor = Number(config.temp_alerta_calor);
                umidMin = Number(config.umid_min_ideal);
                umidMax = Number(config.umid_max_ideal);
                umidSeca = Number(config.umid_alerta_seco);
                umidRisco = Number(config.umid_alerta_excessiva);
                buscarColmeias();
              });
            } else {
              buscarColmeias();
            }
          })
          .catch(function (erro) {
            console.log(erro);
            listaTabelaDashboard.innerHTML = `<tr><td colspan="6">Não foi possível carregar as colmeias. Verifique se o servidor está rodando.</td></tr>`;
          });
      }

      function buscarColmeias() {
        fetch(`/dashboard/listarColmeias/${idEndereco}`)
          .then(function (resposta) {
            if (resposta.ok) {
              resposta.json().then(function (colmeias) {
                mostrarColmeias(colmeias);
              });
            } else {
              listaTabelaDashboard.innerHTML = `<tr><td colspan="6">Não foi possível carregar as colmeias.</td></tr>`;
            }
          })
          .catch(function (erro) {
            console.log(erro);
            listaTabelaDashboard.innerHTML = `<tr><td colspan="6">Não foi possível carregar as colmeias. Verifique se o servidor está rodando.</td></tr>`;
          });
      }

      function mostrarColmeias(colmeias) {
        if (colmeias.length == 0) {
          listaTabelaDashboard.innerHTML = `<tr><td colspan="6">Nenhuma colmeia cadastrada nesse apiário.</td></tr>`;
          return;
        }

        let html = "";
        let qtdRisco = 0;
        let qtdAtencao = 0;
        let qtdIdeal = 0;

        for (let i = 0; i < colmeias.length; i++) {
          let colmeia = colmeias[i];

          if (colmeia.temperatura == null || colmeia.umidade == null) {
            html += `
              <tr class="linha-clicavel" data-situacao="Sem leitura" onclick="location.href='dashboard.html?colmeia=${i}'">
                <td><span class="nome-colmeia">${colmeia.codigo}</span></td>
                <td><span class="tag-status">Sem leitura</span></td>
                <td class="col-valor">--</td>
                <td></td>
                <td class="col-valor">--</td>
                <td></td>
              </tr>`;
            continue;
          }

          let temperatura = Number(colmeia.temperatura);
          let umidade = Number(colmeia.umidade);
          let situacao = "Ideal";
          let tag = "tag-verde";
          let ponto = "verde";

          if (temperatura < tempFrio || temperatura > tempCalor || umidade < umidSeca || umidade >= umidRisco) {
            situacao = "Risco";
            tag = "tag-vermelho";
            ponto = "vermelho";
            qtdRisco++;
          } else if (temperatura < tempMin || temperatura > tempMax || umidade < umidMin || umidade > umidMax) {
            situacao = "Atenção";
            tag = "tag-amarelo";
            ponto = "amarelo";
            qtdAtencao++;
          } else {
            qtdIdeal++;
          }

          html += `
            <tr class="linha-clicavel" data-situacao="${situacao}" onclick="location.href='dashboard.html?colmeia=${i}'">
              <td><span class="nome-colmeia">${colmeia.codigo}</span></td>
              <td><span class="tag-status ${tag}"><i class="ponto ${ponto}"></i> ${situacao}</span></td>
              <td class="col-valor">${temperatura.toFixed(1).replace(".", ",")} °C</td>
              <td>${comparar(temperatura, tempMin, tempMax, tempFrio, tempCalor, " °C")}</td>
              <td class="col-valor">${Math.round(umidade)}%</td>
              <td>${comparar(umidade, umidMin, umidMax, umidSeca, umidRisco, "%")}</td>
            </tr>`;
        }

        listaTabelaDashboard.innerHTML = html;

        select_filtro.innerHTML = `
          <option value="todas">Todas as colmeias (${colmeias.length})</option>
          <option value="Risco">Em risco (${qtdRisco})</option>
          <option value="Atenção">Em atenção (${qtdAtencao})</option>
          <option value="Ideal">Ideais (${qtdIdeal})</option>
        `;

        let filtroDaUrl = new URLSearchParams(location.search).get("filtro");
        if (filtroDaUrl != null) {
          select_filtro.value = filtroDaUrl;
        }

        filtrarTabelaDashboard();
      }

      function filtrarTabelaDashboard() {
        let filtro = select_filtro.value;
        let linhas = listaTabelaDashboard.children;

        for (let i = 0; i < linhas.length; i++) {
          let situacao = linhas[i].getAttribute("data-situacao");

          if (filtro == "todas" || situacao == filtro) {
            linhas[i].style.display = "";
          } else {
            linhas[i].style.display = "none";
          }
        }
      }

      function resetarFiltroDashboard() {
        select_filtro.value = "todas";
        filtrarTabelaDashboard();
      }

      buscarConfig();
    </script>
  </body>
</html>
