<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style1.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <title>Calculadora Financeira - Colmeia Conectada</title>
</head>
<body>
    
    <div class="header">
        <img src="../src/tetria-logo-transparente.png" alt="Logo Tetria" class="img">
        <h1>CALCULADORA FINANCEIRA</h1>
    </div>

    <!-- CONTAINER QUE CENTRALIZA AS DUAS LADO A LADO -->
    <div class="container-calculadoras">
        <!-- CALCULADORA 1 -->
        <div class="calculo">
            <div class="campo">
                <label for="ipt_qtd_colmeia">Quantidade de Colmeias: </label>
                <input type="number" value="150" id="ipt_qtd_colmeia">
            </div>
            
            <div class="campo">
                <label for="ipt_enxame_Jatai">Valor médio do enxame de abelha Jataí: </label>
                <input type="number" value="275.00" id="ipt_enxame_Jatai">
            </div>
            
            <div class="campo">
                <label for="ipt_qtd_mel_ano">Quantos (kg) de mel é produzido por colmeia ao ano?</label>
                <input type="text" value="1" id="ipt_qtd_mel_ano">

            </div>

            <div class="campo">
                <label for="ipt_valor_mel">Valor do mel por kg: </label>
                <input type="text" value="300" id="ipt_valor_mel">

            </div>

            <div class="campo">
                <label for="input_colmeia_perdida">Quantidade de colmeias perdidas ao ano: </label>
                <input type="text" value="40" id="input_colmeia_perdida">
                <span><b><i>*Por temperatura e umidade</i></b></span>
            </div>

            <div class="btn">
                <button onclick="Calculo1()">Calcular</button>
            </div>

            <div class="mensagem">
                <div id="div_mensagem"></div>
            </div>
        </div>
        
 
</body>
</html>

<script>
    function Calculo1(){

        let qtdColmeias = Number(ipt_qtd_colmeia.value);
        let valorEnxame = Number(ipt_enxame_Jatai.value);
        let MelColmeia = Number(ipt_qtd_mel_ano.value);
        let valorMelKg = Number(ipt_valor_mel.value);
        let colmeiaPerdidaAno = Number(input_colmeia_perdida.value);

        //quantidade total do mel ao ano 
        let melAno = MelColmeia * qtdColmeias
        
        //valor total do mel ao ano
        let valorAoAno = melAno * valorMelKg

        //valor ao mes
        let valorAoMes = valorAoAno / 12

        //valor da reconstituição
        let custoReposicao = colmeiaPerdidaAno * valorEnxame

        //valor da perda 
        let  valorPerdido = (valorAoAno / qtdColmeias) / 12 * 6 * colmeiaPerdidaAno

        // estimativa de aumento de produção

        let aumentoProducao = valorAoAno * 1.10


        div_mensagem.innerHTML = `
        <b> PERDA </B> <br>
        Valor ao ano sem perdas: ${valorAoAno.toFixed(2)} <br>
        Valor com a perda de ${colmeiaPerdidaAno} colmeias por temperatura e umidade: ${valorPerdido.toFixed(2)} <br> <br>
        <b> ECONOMIA <b> <br>
        Valor da reconstrução das colmeias perdidas: ${custoReposicao.toFixed(2)} <br>
        Aumento de produção com o sistema de monitoramento: ${aumentoProducao.toFixed(2)}
        `

  }
</script>
