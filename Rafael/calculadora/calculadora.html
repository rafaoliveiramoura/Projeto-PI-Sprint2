<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <title>Calculadora Financeira - Colmeia Conectada</title>
</head>
<body>
    
    <div class="header">
        <img src="../src/tetria-logo-transparente.png" alt="Logo Tetria" class="img">
        <h1>CALCULADORA FINANCEIRA</h1>
    </div>

    <!-- CONTAINER QUE CENTRALIZA AS DUAS LADO A LADO -->
    <div class="container-calculadoras">
        <!-- CALCULADORA 1 -->
        <div class="calculo">
            <div class="campo">
                <label for="ipt_qntcolmeias">Quantidade de Colmeias </label>
                <input type="number" id="ipt_qntcolmeias">
            </div>
            
            <div class="campo">
                <label for="ipt_qntmel">Valor médio de cada colmeia</label>
                <input type="number" id="ipt_valorcolmeia">
            </div>
            
            <div class="campo">
                <label for="ipt_enxame">Quantidade perdida por ano</label>
                <input type="text" id="ipt_perdida">
            </div>

            <div class="btn">
                <button onclick="Calculo1()">Calcular</button>
            </div>

            <div class="mensagem">
                <div id="div_mensagem"></div>
            </div>
        </div>
        

        <!-- CALCULADORA 2 -->
        <div class="calculo">
            <div class="campo">
                <label for="ipt_qntcolmeias2">Quantidade de Colmeias</label>
                <input type="number" id="ipt_qntcolmeias2">
            </div>
            
            <div class="campo">
                <label for="ipt_qntmel2">Quantos ml cada Colmeia produz</label>
                <input type="text" id="ipt_qntmel2">
            </div>
            
            <div class="campo">
                <label for="ipt_enxame2">Quanto custa o enxame de Jataí</label>
                <input type="text" id="ipt_enxame2">
            </div>

            <div class="btn">
                <button>Calcular</button>
            </div>

            <div class="mensagem2">
                <div id="div_mensagem2"></div>
            </div>
        </div>

    </div>
</body>
</html>

<script>
    function Calculo1(){
        let qtdColmeias = Number(ipt_qntcolmeias.value);
        let valorPorColmeia = Number(ipt_valorcolmeia.value);
        let perdaPorAno = Number(ipt_perdida.value);

        // valor total das colmeias por ano 
        let valorPorAno = qtdColmeias * valorPorColmeia;

        // valor perdido por ano
        let valorPerdido = perdaPorAno * valorPorColmeia;

        // Percentual de perdas
        let percentualPerda = ( perdaPorAno / qtdColmeias) * 100

        div_mensagem.innerHTML = `<span style: "font-family: 'Montserrat', sans-serif; font-size: 30px"> Valor total de colmeias por ano é de R$${valorPorAno.toFixed(2)}<br> <br>
        Valor perdido é de R$${valorPerdido.toFixed(2)}<br> <br>
        Com um percentual de perda de aproximadamente ${percentualPerda.toFixed(2)}%</span>`

    }
</script>
