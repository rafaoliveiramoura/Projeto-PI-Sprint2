<!doctype html>
<html>

<head>
    <title>Graphics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="container">
        <h1>Dashboard</h1>
    </div>
    
    <div style="display: flex;">
        <div style="width: 50%;" id="grafico1">
            <canvas id="sensorAnalogico"></canvas>
        </div>
        <div style="width: 50%;" id="grafico2">
            <canvas id="sensorDigital"></canvas>
        </div>
    </div>

    <script>
        var sensorAnalogico = new Chart(document.getElementById('sensorAnalogico').getContext('2d'), {
            type: 'line',
            data: {
                datasets: [{
                    label: 'Temperatura',
                    borderColor: '#63B1BC',
                    backgroundColor: '#ED145B'
                }]
            },
            options: {
                scales: {
                    x: {
                        beginAtZero: true
                    },
                    y: {
                        title: {
                            display: true,
                            text: '(%)'
                        },
                        beginAtZero: true,
                    },
                },
            }
        });

        var sensorDigital = new Chart(document.getElementById('sensorDigital').getContext('2d'), {
            type: 'line',
            data: {
                datasets: [{
                    label: 'Umidade',
                    borderColor: '#63B1BC',
                    backgroundColor: '#0762C8'
                }]
            },
            options: {
                scales: {
                    x: {
                        beginAtZero: true
                    },
                    y: {
                        title: {
                            display: true,
                            text: '(0-1)'
                        },
                        beginAtZero: true
                    }
                }
            }
        });

        var paginacao = {};
        var tempo = {};

        function obterDados(grafico, propriedade) {
            fetch('http://localhost:3300/sensores/analogico')
                .then(response => response.json())
                .then(dados => {
                    const valores = dados[propriedade];

                    if (paginacao[propriedade] == null) {
                        paginacao[propriedade] = 0;
                    }
                    if (tempo[propriedade] == null) {
                        tempo[propriedade] = 0;
                    }

                    var ultimaPaginacao = paginacao[propriedade];
                    paginacao[propriedade] = valores.length;
                    var novosValores = valores.slice(ultimaPaginacao);

                    novosValores.forEach((valor) => {
                        if (grafico.data.labels.length == 10 && grafico.data.datasets[0].data.length == 10) {
                            grafico.data.labels.shift();
                            grafico.data.datasets[0].data.shift();
                        }

                        grafico.data.labels.push(tempo[propriedade]++);
                        grafico.data.datasets[0].data.push(parseFloat(valor));
                        grafico.update();
                    });
                })
                .catch(error => console.error('Erro ao obter dados:', error));
        }

        setInterval(() => {
            obterDados(sensorAnalogico, 'temperatura');
            obterDados(sensorDigital, 'umidade');
        }, 1000);

    </script>
</body>

</html>
