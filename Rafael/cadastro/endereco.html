<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Endereço</title>
    <link rel="stylesheet" href="endereço.css">
</head>
<body>

    <div class="main-wrapper">
        <div class="cadastro-container">

            <div class="header">
                <h1>Meu Endereço</h1>
                <span>Complete as informações</span>
            </div>

            <form id="form-endereco">
                <div class="input-group">
                    <label for="cep">CEP</label>
                    <input type="text" id="cep" placeholder="00000-000" required>
                </div>
                <div class="input-group">
                    <label for="rua">Rua/Avenida</label>
                    <input type="text" id="rua" placeholder="Digite o nome da rua" required>
                </div>
                <div class="input-group">
                    <label for="numero">Número</label>
                    <input type="text" id="numero" placeholder="Ex: 123" required>
                </div>
                <div class="input-group">
                    <label for="bairro">Bairro</label>
                    <input type="text" id="bairro" placeholder="Digite seu bairro" required>
                </div>
                <div class="input-group">
                    <label for="cidade">Cidade</label>
                    <input type="text" id="cidade" placeholder="Sua cidade" required>
                </div>
                <div class="input-group">
                    <label for="estado">Estado</label>
                    <input type="text" id="estado" placeholder="Ex: SP" maxlength="2" required>
                </div>

                <div class="btn">
                    <button type="submit">Salvar Endereço</button>
                </div>
            </form>

        </div>
    </div>

    <script>
        document.getElementById('form-endereco').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Endereço salvo com sucesso!');
        });

         let listaEmpresasCadastradas = [];

  function cadastrar() {

    //Recupere o valor da nova input pelo nome do id
    var cepVar = cep.value;
    var ruaVar = rua.value;
    var numeroVar = numero.value;
    var bairroVar = bairro.value;
    var cidadeVar = cidade.value;
    var estadoVar = estado.value;
    

    // Verificando se há algum campo em branco
    if (
      cepVar == "" ||
      ruaVar == "" ||
      numeroVar == "" ||
      bairroVar == "" ||
      cidadeVar == "" ||
      estadoVar == "") {    
      alert("Por favor, preencha todos os campos!");
      return false;
    }

    // Enviando o valor da nova input
    fetch("http://127.0.0.1:3333/usuarios/cadastrarenderco", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        cepVar: cep,
        ruaVar: rua,
        numeroVar: numero,
        bairroVar: bairro,
        cidadeVar: cidade,
        estadoVar: estado
    
      }),
    })
      .then(function (resposta) {
        if (resposta.ok) {
          alert("Cadastro realizado com sucesso! Redirecionando...");
          setTimeout(() => {
            window.location = "../cadastro/cadastroempresa.html";
          }, 2000);
        } else {
          throw new Error("Houve um erro ao tentar realizar o cadastro!");
        }
      })
      .catch(function (erro) {
        console.log(`#ERRO: ${erro}`);
        alert(erro.message);
      });

    return false;
  }


  function sumirMensagem() {
    cardErro.style.display = "none";
  }
    </script>
</body>
</html>
