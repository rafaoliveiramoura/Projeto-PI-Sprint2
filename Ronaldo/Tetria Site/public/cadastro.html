<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Document</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles/cadastro.css" />


</head>

<body>

    <div class="header">
        <div class="container">
            <img src="./assets/logo-icon.svg" alt="Titria Logo">
            <div class="text">
                <h3>Tetria Cadastro</h3>
            </div>
        </div>
    </div>

    <div class="cadastro">
        <div class="container-left">
            <div class="big-image">
            </div>
        </div>

        <div class="container-right">
            <div class="formulario">
                <h1>Crie sua conta</h1>
                <h4>Cadastre-se para acompanhar suas colmeias</h4>
                <div class="campo">
                    <span>Código de ativação:</span>
                    <input id="codigo_input" type="text" placeholder="Insira aqui seu código" />
                </div>
                <div class="campo">
                    <span>Nome completo:</span>
                    <input id="nome_input" type="text" placeholder="Seu nome completo" />
                </div>
                <div class="campo">
                    <span>Telefone:</span>
                    <input id="telefone_input" type="text" placeholder="(00) 12345-6789" />
                </div>
                <div class="campo">
                    <span>E-mail:</span>
                    <input id="email_input" type="text" placeholder="seu@email.com" />
                </div>
                <div class="campo">
                    <span>Senha:</span>
                    <input id="senha_input" type="password" placeholder="******" />
                </div>
            </div>
        </div>

    </div>



</body>

</html>
