<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="style.css" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Poppins:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />

    <title>Calculadora Financeira - Colmeia Conectada</title>
  </head>

  <body>
    <!-- CABEÇALHO -->
    <div class="mainheader">
      <div class="mainbody">
      <div class="header">
      <img
        src="../Renan/src/tetria-logo-transparente.png"
        alt="Logo Tetria"
        class="img"
      />

      <h1>CALCULADORA FINANCEIRA</h1>

      <p>Calcule os resultados financeiros das suas colmeias</p>
    </div>
    </div>

    <!-- CONTAINER DAS CALCULADORAS -->
    <div class="container-calculadoras">
      <!-- ========================= -->
      <!-- CALCULADORA 1 -->
      <!-- ========================= -->

      <div class="calculo">
        <h2>🐝 Dados das Colmeias</h2>

        <!-- QUANTIDADE DE COLMEIAS -->
        <div class="campo">
          <label for="ipt_qtd_colmeia"> Quantidade de Colmeias: </label>

          <input type="number" value="125" id="ipt_qtd_colmeia" />
        </div>

        <!-- VALOR DO ENXAME -->
        <div class="campo">
          <label for="ipt_enxame_Jatai">
            Valor médio do enxame de abelha Jataí:
          </label>

          <input
            type="number"
            step="0.01"
            value="275.00"
            id="ipt_enxame_Jatai"
          />
        </div>

        <!-- PRODUÇÃO DE MEL -->
        <div class="campo">
          <label for="ipt_qtd_Mel">
            Quantos (ml) de mel é produzido por colmeia no mês?
          </label>

          <input type="number" value="1000" id="ipt_qtd_Mel" />
        </div>

        <!-- VALOR DO MEL -->
        <div class="campo">
          <label for="ipt_valor_mel"> Valor do mel por ml: </label>

          <input type="number" step="0.01" value="0.79" id="ipt_valor_mel" />
        </div>

        <!-- COLMEIAS PERDIDAS -->
        <div class="campo campo-perda">
          <label for="input_colmeia_perdida">
            Quantidade de colmeias perdidas ao ano:
          </label>

          <input type="number" value="0" id="input_colmeia_perdida" />

          <span> *Por temperatura e umidade </span>
        </div>

        <!-- BOTÃO -->
        <div class="btn">
          <button onclick="Calculo1()">CALCULAR</button>
        </div>

        <!-- RESULTADO -->
        <div class="mensagem">
          <h3>RESULTADO</h3>

          <div id="div_mensagem"></div>
        </div>
      </div>

      <!-- ========================= -->
      <!-- CALCULADORA 2 -->
      <!-- ========================= -->

      <div class="calculo">
        <h2>💰 Projeção Financeira</h2>

        <!-- QUANTIDADE DE COLMEIAS -->
        <div class="campo">
          <label for="ipt_qtd_colmeia2"> Quantidade de Colmeias: </label>

          <input type="number" id="ipt_qtd_colmeia2" />
        </div>

        <!-- PRODUÇÃO DE MEL -->
        <div class="campo">
          <label for="ipt_qntmel2"> Quantos ml cada Colmeia produz: </label>

          <input type="number" id="ipt_qntmel2" />
        </div>

        <!-- VALOR DO ENXAME -->
        <div class="campo">
          <label for="ipt_enxame2"> Quanto custa o enxame de Jataí: </label>

          <input type="number" step="0.01" id="ipt_enxame2" />
        </div>

        <!-- BOTÃO -->
        <div class="btn">
          <button onclick="Calculo2()">CALCULAR</button>
        </div>

        <!-- RESULTADO -->
        <div class="mensagem">
          <h3>RESULTADO</h3>

          <div id="div_mensagem2"></div>
        </div>
      </div>
    </div>
    </div>

    <!-- ========================= -->
    <!-- JAVASCRIPT -->
    <!-- ========================= -->

    <script>
      function Calculo1() {
        // Pegando os valores dos inputs
        let qtdColmeias = Number(
          document.getElementById("ipt_qtd_colmeia").value,
        );

        let valorEnxame = Number(
          document.getElementById("ipt_enxame_Jatai").value,
        );

        let qtdMelMes = Number(document.getElementById("ipt_qtd_Mel").value);

        let valorMel = Number(document.getElementById("ipt_valor_mel").value);

        let colmeiaPerdida = Number(
          document.getElementById("input_colmeia_perdida").value,
        );

        // =========================
        // CÁLCULOS
        // =========================

        // Valor do mel produzido por mês
        let valorMelMes = qtdMelMes * valorMel;

        // Valor do mel produzido por ano
        let valorMelAno = valorMelMes * 12;

        // Valor total dos enxames
        let valorTotalEnxame = qtdColmeias * valorEnxame;

        // Valor das colmeias perdidas
        let valorPerdido = colmeiaPerdida * valorEnxame;

        // Percentual de perdas
        let percentualPerda = 0;

        if (qtdColmeias > 0) {
          percentualPerda = (colmeiaPerdida / qtdColmeias) * 100;
        }

        // =========================
        // MOSTRAR RESULTADO
        // =========================

        document.getElementById("div_mensagem").innerHTML = `

                <p>
                    Valor total dos enxames:
                    <strong>
                        R$ ${valorTotalEnxame.toFixed(2)}
                    </strong>
                </p>

                <p>
                    Receita do mel por mês:
                    <strong>
                        R$ ${valorMelMes.toFixed(2)}
                    </strong>
                </p>

                <p>
                    Receita do mel por ano:
                    <strong>
                        R$ ${valorMelAno.toFixed(2)}
                    </strong>
                </p>

                <p>
                    Valor perdido:  
                    <strong>
                        R$ ${valorPerdido.toFixed(2)}
                    </strong>
                </p>

                <p>
                    Percentual de perda:
                    <str    ong>
                        ${percentualPerda.toFixed(2)}%
                    </strong>
                </p>

            `;
      }

      function Calculo2() {
        // Pegando os valores
        let qtdColmeias = Number(
          document.getElementById("ipt_qtd_colmeia2").value,
        );

        let qtdMel = Number(document.getElementById("ipt_qntmel2").value);

        let valorEnxame = Number(document.getElementById("ipt_enxame2").value);

        // =========================
        // CÁLCULOS
        // =========================

        // Produção total mensal
        let producaoTotal = qtdColmeias * qtdMel;

        // Produção anual
        let producaoAnual = producaoTotal * 12;

        // Valor total dos enxames
        let valorTotalEnxames = qtdColmeias * valorEnxame;

        // =========================
        // MOSTRAR RESULTADO
        // =========================

        document.getElementById("div_mensagem2").innerHTML = `

                <p>
                    Produção mensal:
                    <strong>
                        ${producaoTotal.toFixed(0)} ml
                    </strong>
                </p>

                <p>
                    Produção anual:
                    <strong>
                        ${producaoAnual.toFixed(0)} ml
                    </strong>
                </p>

                <p>
                    Valor dos enxames:
                    <strong>
                        R$ ${valorTotalEnxames.toFixed(2)}
                    </strong>
                </p>

            `;
      }
    </script>
  </body>
</html>
