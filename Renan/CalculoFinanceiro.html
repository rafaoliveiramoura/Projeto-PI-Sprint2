<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="style.css" />

    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Poppins:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />

    <title>Calculadora Financeira - Colmeia Conectada</title>
  </head>

  <body>
    <header class="mainheader">
      <nav class="navbar">
        <div class="nav-container">
          <div class="nav-logo">
            <img
              src="../Renan/src/tetria-logo-transparente.png"
              alt="Logo Tetria"
              class="nav-img"
            />
          </div>

          <ul class="nav-links">
            <li>
              <a href="../Rafael/home/home.html"> Início </a>
            </li>

            <li>
              <a href="#"> Calculadoras </a>
            </li>

            <li>
              <a href="#"> Sobre </a>
            </li>

            <li>
              <a href="#"> Contato </a>
            </li>
          </ul>
        </div>
      </nav>

      <div class="header">
        <div class="header-text">
          <h1>CALCULADORA FINANCEIRA</h1>

          <p>Calcule os resultados financeiros das suas colmeias</p>
        </div>
      </div>
    </header>

    <!-- CONTAINER DAS CALCULADORAS -->

    <main class="mainbody">
      <div class="container-calculadoras">
        <!-- CALCULADORA 1 -->
        

        <div class="calculo" id="calc1">
          <h2> Dados das Colmeias</h2>

          <!-- QUANTIDADE DE COLMEIAS -->

          <div class="campo">
            <label for="ipt_qtd_colmeia"> Quantidade de Colmeias: </label>

            <input type="" value="125" id="ipt_qtd_colmeia" />

            <span class="error-message" id="err_ipt_qtd_colmeia"> </span>
          </div>

          <!-- VALOR DO ENXAME -->

          <div class="campo">
            <label for="ipt_enxame_Jatai">
              Valor médio do enxame de abelha Jataí:
            </label>

            <input type="" value="275" id="ipt_enxame_Jatai" />

            <span class="error-message" id="err_ipt_enxame_Jatai"> </span>
          </div>

          <!-- PRODUÇÃO DE MEL -->

          <div class="campo">
            <label for="ipt_qtd_Mel">
              Quantos (ml) de mel é produzido por colmeia no mês?
            </label>

            <input type="" value="1000" id="ipt_qtd_Mel" />

            <span class="error-message" id="err_ipt_qtd_Mel"> </span>
          </div>

          <!-- VALOR DO MEL -->

          <div class="campo">
            <label for="ipt_valor_mel"> Valor do mel por ml: </label>

            <input type="" value="0.79" id="ipt_valor_mel" />

            <span class="error-message" id="err_ipt_valor_mel"> </span>
          </div>

          <!-- COLMEIAS PERDIDAS -->

          <div class="campo campo-perda">
            <label for="input_colmeia_perdida">
              Quantidade de colmeias perdidas ao ano:
            </label>

            <input type="" value="0" id="input_colmeia_perdida" />

            <span class="error-message" id="err_input_colmeia_perdida"> </span>

            <span class="info-perda"> *Por temperatura e umidade </span>
          </div>

          <!-- BOTÕES -->

          <div class="btn-group">
            <button onclick="Calculo1()" id="btn_calc1">CALCULAR</button>

            <button class="btn-clear" onclick="limparCampos1()">LIMPAR</button>
          </div>

          <!-- RESULTADO -->

          <div class="mensagem">
            <h3>RESULTADO</h3>

            <div id="div_mensagem"></div>
          </div>
        </div>

        
        <!-- CALCULADORA 2 -->
        

        <div class="calculo" id="calc2">
          <h2>💰 Projeção Financeira</h2>

          <!-- QUANTIDADE DE COLMEIAS -->

          <div class="campo">
            <label for="ipt_qtd_colmeia2"> Quantidade de Colmeias: </label>

            <input type="" id="ipt_qtd_colmeia2" />

            <span class="error-message" id="err_ipt_qtd_colmeia2"> </span>
          </div>

          <!-- PRODUÇÃO DE MEL -->

          <div class="campo">
            <label for="ipt_qntmel2"> Quantos ml cada Colmeia produz: </label>

            <input type="" id="ipt_qntmel2" />

            <span class="error-message" id="err_ipt_qntmel2"> </span>
          </div>

          <!-- VALOR DO ENXAME -->

          <div class="campo">
            <label for="ipt_enxame2"> Quanto custa o enxame de Jataí: </label>

            <input type="" id="ipt_enxame2" />

            <span class="error-message" id="err_ipt_enxame2"> </span>
          </div>

          <!-- BOTÕES -->

          <div class="btn-group">
            <button onclick="Calculo2()" id="btn_calc2">CALCULAR</button>

            <button class="btn-clear" onclick="limparCampos2()">LIMPAR</button>
          </div>

          <!-- RESULTADO -->

          <div class="mensagem">
            <h3>RESULTADO</h3>
            

          <div id="div_mensagem2"></div>
          </div>
        </div>
      </div>
    </main>
    <script>
      
      // CALCULADORA 1
      function Calculo1() {
        // Pegando os valores dos campos
        let qtdColmeias = Number(ipt_qtd_colmeia.value);
        let valorEnxame = Number(ipt_enxame_Jatai.value);
        let qtdMelMes = Number(ipt_qtd_Mel.value);
        let valorMel = Number(ipt_valor_mel.value);
        let colmeiaPerdida = Number(input_colmeia_perdida.value);

        // Variável para verificar se todos os campos estão corretos
        let valido = true;

        // VALIDAÇÃO DA QUANTIDADE DE COLMEIAS

        if (qtdColmeias == "") {
          err_ipt_qtd_colmeia.innerHTML = "Digite a quantidade de colmeias.";
          valido = false;

        } else if (qtdColmeias < 0) {
          err_ipt_qtd_colmeia.innerHTML = "A quantidade não pode ser negativa.";
          valido = false;

        } else {
          err_ipt_qtd_colmeia.innerHTML = "";
        }
        // VALIDAÇÃO DO VALOR DO ENXAME

        if (valorEnxame == "") {
          err_ipt_enxame_Jatai.innerHTML = "Digite o valor do enxame.";
          valido = false;

        } else if (valorEnxame < 0) {
          err_ipt_enxame_Jatai.innerHTML = "O valor não pode ser negativo.";
          valido = false;

        } else {
          err_ipt_enxame_Jatai.innerHTML = "";
        }

        // VALIDAÇÃO DA PRODUÇÃO DE MEL

        if (qtdMelMes == "") {
          err_ipt_qtd_Mel.innerHTML = "Digite a quantidade de mel.";
          valido = false;

        } else if (qtdMelMes < 0) {
          err_ipt_qtd_Mel.innerHTML = "A quantidade não pode ser negativa.";
          valido = false;

        } else {
          err_ipt_qtd_Mel.innerHTML = "";
        }

        // VALIDAÇÃO DO VALOR DO MEL

        if (valorMel == "") {
          err_ipt_valor_mel.innerHTML = "Digite o valor do mel.";
          valido = false;

        } else if (valorMel < 0) {
          err_ipt_valor_mel.innerHTML = "O valor não pode ser negativo.";
          valido = false;

        } else {
          err_ipt_valor_mel.innerHTML = "";
        }

        // VALIDAÇÃO DAS COLMEIAS PERDIDAS

        if (colmeiaPerdida == "") {
          err_input_colmeia_perdida.innerHTML =
            "Digite a quantidade de colmeias perdidas.";

          valido = false;
        } else if (colmeiaPerdida < 0) {
          err_input_colmeia_perdida.innerHTML =
            "A quantidade não pode ser negativa.";

          valido = false;
        } else if (colmeiaPerdida > qtdColmeias) {
          err_input_colmeia_perdida.innerHTML =
            "As colmeias perdidas não podem ser maiores que a quantidade total.";

          valido = false;
        } else {
          err_input_colmeia_perdida.innerHTML = "";
        }

        // FAZ OS CÁLCULOS SOMENTE SE ESTIVER TUDO CERTO

        if (valido == true) {
          // Valor do mel produzido por mês
          let valorMelMes = qtdMelMes * valorMel;
          // Valor do mel produzido por ano
          let valorMelAno = valorMelMes * 12;
          // Valor total dos enxames
          let valorTotalEnxame = qtdColmeias * valorEnxame;
          // Valor perdido pelas colmeias
          let valorPerdido = colmeiaPerdida * valorEnxame;
          // Percentual de perda
          let percentualPerda = 0;

          if (qtdColmeias > 0) {
            percentualPerda = (colmeiaPerdida / qtdColmeias) * 100;
          }

          // MOSTRANDO OS RESULTADOS
          div_mensagem.innerHTML =
            "<p>Valor total dos enxames: <strong>R$ " +
            valorTotalEnxame +
            "</strong></p>" +
            "<p>Receita do mel por mês: <strong>R$ " +
            valorMelMes +
            "</strong></p>" +
            "<p>Receita do mel por ano: <strong>R$ " +
            valorMelAno +
            "</strong></p>" +
            "<p>Valor perdido: <strong>R$ " +
            valorPerdido +
            "</strong></p>" +
            "<p>Percentual de perda: <strong>" +
            percentualPerda +
            "%</strong></p>";
        }
      }

      function limparCampos1() {
        ipt_qtd_colmeia.value = "";
        ipt_enxame_Jatai.value = "";
        ipt_qtd_Mel.value = "";
        ipt_valor_mel.value = "";
        input_colmeia_perdida.value = "";
        err_ipt_qtd_colmeia.innerHTML = "";
        err_ipt_enxame_Jatai.innerHTML = "";
        err_ipt_qtd_Mel.innerHTML = "";
        err_ipt_valor_mel.innerHTML = "";
        err_input_colmeia_perdida.innerHTML = "";
        div_mensagem.innerHTML = "";
      }
      // CALCULADORA 2

      function Calculo2() {
        let qtdColmeias = Number(ipt_qtd_colmeia2.value);
        let qtdMel = Number(ipt_qntmel2.value);
        let valorEnxame = Number(ipt_enxame2.value);

        let valido = true;

        // VALIDAÇÃO DA QUANTIDADE DE COLMEIAS
        if (qtdColmeias == "") {
          err_ipt_qtd_colmeia2.innerHTML = "Digite a quantidade de colmeias.";
          valido = false;

        } else if (qtdColmeias < 0) {
          err_ipt_qtd_colmeia2.innerHTML =
            "A quantidade não pode ser negativa.";
          valido = false;

        } else {
          err_ipt_qtd_colmeia2.innerHTML = "";
        }

        // VALIDAÇÃO DA PRODUÇÃO DE MEL
        if (qtdMel == "") {
          err_ipt_qntmel2.innerHTML = "Digite a quantidade de mel.";
          valido = false;

        } else if (qtdMel < 0) {
          err_ipt_qntmel2.innerHTML = "A quantidade não pode ser negativa.";
          valido = false;

        } else {
          err_ipt_qntmel2.innerHTML = "";
        }

        // VALIDAÇÃO DO VALOR DO ENXAME
        if (valorEnxame == "") {
          err_ipt_enxame2.innerHTML = "Digite o valor do enxame.";
          valido = false;

        } else if (valorEnxame < 0) {
          err_ipt_enxame2.innerHTML = "O valor não pode ser negativo.";
          valido = false;

        } else {
          err_ipt_enxame2.innerHTML = "";
        }

        // FAZ OS CÁLCULOS SOMENTE SE ESTIVER TUDO CERTO
        if (valido == true) {
          // Produção mensal
          let producaoTotal = qtdColmeias * qtdMel;

          // Produção anual
          let producaoAnual = producaoTotal * 12;
          // Valor total dos enxames
          let valorTotalEnxames = qtdColmeias * valorEnxame;

          div_mensagem2.innerHTML =
            "<p>Produção mensal: <strong>" +
            producaoTotal +
            " ml</strong></p>" +
            "<p>Produção anual: <strong>" +
            producaoAnual +
            " ml</strong></p>" +
            "<p>Valor dos enxames: <strong>R$ " +
            valorTotalEnxames +
            "</strong></p>";
        }
      }
      
      // LIMPAR CALCULADORA 
      function limparCampos2() {
        ipt_qtd_colmeia2.value = "";
        ipt_qntmel2.value = "";
        ipt_enxame2.value = "";
        err_ipt_qtd_colmeia2.innerHTML = "";
        err_ipt_qntmel2.innerHTML = "";
        err_ipt_enxame2.innerHTML = "";
        div_mensagem2.innerHTML = "";
      }
    </script>
  </body>
</html>
