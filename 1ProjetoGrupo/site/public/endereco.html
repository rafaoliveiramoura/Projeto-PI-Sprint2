<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetria | Cadastro de Endereço</title>
    <link rel="stylesheet" href="css/endereco.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="main-wrapper">
        <div class="cadastro-container">

            <div class="header">
                <a href="index.html">
                    <img src="assets/tetria-logo-transparente.png" alt="Logo Tetria" style="max-height: 40px; margin-bottom: 10px;">
                </a>
                <h1>Localização do Apiário</h1>
                <span>Passo 3 de 3: Endereço da instalação ou empresa</span>
            </div>

            <form id="form-endereco" onsubmit="event.preventDefault(); concluirCadastro();">
                <div class="input-group">
                    <label for="cep">CEP</label>
                    <input type="text" id="cep" placeholder="00000-000" value="18600-000" required>
                </div>
                <div class="input-group">
                    <label for="rua">Logradouro / Rua</label>
                    <input type="text" id="rua" placeholder="Estrada, Rua ou Avenida" value="Estrada Municipal José Antônio Pereira" required>
                </div>
                <div class="input-group">
                    <label for="numero">Número</label>
                    <input type="text" id="numero" placeholder="Ex: 123 ou km 12" value="km 12" required>
                </div>
                <div class="input-group">
                    <label for="complemento">Complemento / Apiário</label>
                    <input type="text" id="complemento" placeholder="Ex: Sítio São José, Bloco A" value="Apiário Rio Bonito" required>
                </div>
                <div class="input-group">
                    <label for="bairro">Bairro</label>
                    <input type="text" id="bairro" placeholder="Digite o bairro ou zona rural" value="Bairro Rio Bonito" required>
                </div>
                <div class="input-group">
                    <label for="cidade">Cidade</label>
                    <input type="text" id="cidade" placeholder="Sua cidade" value="Botucatu" required>
                </div>
                <div class="input-group">
                    <label for="estado">Estado (UF)</label>
                    <input type="text" id="estado" placeholder="Ex: SP" maxlength="2" value="SP" required>
                </div>

                <div class="btn" style="margin-top: 15px;">
                    <button type="submit" id="btn_concluir">Finalizar Cadastro</button>
                </div>
            </form>

        </div>
    </div>

    <script>
        window.onload = function() {
            if (!sessionStorage.getItem("CADASTRO_USUARIO") || !sessionStorage.getItem("CADASTRO_COD_EMPRESA")) {
                alert("Etapa anterior não identificada. Redirecionando para o início do cadastro.");
                window.location.href = "cadastro.html";
            }
        };

        function concluirCadastro() {
            var cepVar = cep.value.trim();
            var ruaVar = rua.value.trim();
            var numeroVar = numero.value.trim();
            var complementoVar = complemento.value.trim();
            var bairroVar = bairro.value.trim();
            var cidadeVar = cidade.value.trim();
            var estadoVar = estado.value.trim();

            var codEmpresa = sessionStorage.getItem("CADASTRO_COD_EMPRESA");
            var usuarioObj = JSON.parse(sessionStorage.getItem("CADASTRO_USUARIO") || "{}");

            if (
                cepVar == "" ||
                ruaVar == "" ||
                numeroVar == "" ||
                complementoVar == "" ||
                bairroVar == "" ||
                cidadeVar == "" ||
                estadoVar == ""
            ) {
                alert("Por favor, preencha todos os campos do endereço!");
                return false;
            }

            if (!codEmpresa || !usuarioObj.email) {
                alert("Sessão de cadastro expirada! Por favor, reinicie o cadastro.");
                window.location.href = "cadastro.html";
                return false;
            }

            document.getElementById("btn_concluir").disabled = true;
            document.getElementById("btn_concluir").innerText = "Cadastrando...";

            const baseApi = (window.location.port === "3333") ? "" : "http://localhost:3333";

            // 1. Cadastra o Endereço vinculado à Empresa
            fetch(baseApi + "/usuarios/cadastrarenderco", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({
                    cepServer: cepVar,
                    ruaServer: ruaVar,
                    numeroServer: numeroVar,
                    complementoServer: complementoVar,
                    bairroServer: bairroVar,
                    cidadeServer: cidadeVar,
                    estadoServer: estadoVar,
                    fkEnderecoEmpresa: codEmpresa
                }),
            })
            .then(function (respostaEndereco) {
                if (!respostaEndereco.ok) {
                    throw new Error("Erro ao salvar endereço da empresa!");
                }
                
                // 2. Com a empresa e endereço cadastrados, cadastra o Usuário vinculado ao codempresa
                return fetch(baseApi + "/usuarios/cadastrar", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({
                        nomeServer: usuarioObj.nome,
                        emailServer: usuarioObj.email,
                        senhaServer: usuarioObj.senha,
                        cpfServer: usuarioObj.cpf,
                        telefoneServer: usuarioObj.telefone,
                        fkEmpresaServer: codEmpresa
                    }),
                });
            })
            .then(function (respostaUsuario) {
                if (!respostaUsuario.ok) {
                    throw new Error("Erro ao salvar usuário administrador!");
                }

                // Limpa o estado temporário do cadastro
                sessionStorage.removeItem("CADASTRO_USUARIO");
                sessionStorage.removeItem("CADASTRO_COD_EMPRESA");

                alert("Cadastro concluído com sucesso! Redirecionando para o login...");
                setTimeout(function() {
                    window.location.href = "login.html";
                }, 1500);
            })
            .catch(function (erro) {
                console.log(`#ERRO: ${erro}`);
                alert("Ocorreu um erro: " + erro.message);
                document.getElementById("btn_concluir").disabled = false;
                document.getElementById("btn_concluir").innerText = "Finalizar Cadastro";
            });

            return false;
        }
    </script>
</body>
</html>
