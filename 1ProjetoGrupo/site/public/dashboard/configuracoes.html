<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tetria | Configurações</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="cssdash/config.css">
</head>
<body class="settings-page">
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <img class="logo" src="src/logo-tetria-icone.png" alt="Logo Tetria" />
        <div>
          <h1>TETRIA</h1>
          <p>Monitoramento de colmeias</p>
        </div>
      </div>

      <nav>
        <a id="nav_dashboard" class="nav-link" href="dashboard.html"><svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg><span>Dashboard</span></a>
        <a id="nav_colmeias" class="nav-link" href="colmeias.html"><svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.5l8.5 4.75v9.5L12 21.5l-8.5-4.75v-9.5z"/></svg><span>Colmeias</span></a>
        <a id="nav_mel" class="nav-link" href="historico-mel.html"><svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 11h10v8a3 3 0 0 1-3 3h-4a3 3 0 0 1-3-3v-8z"/><path d="M6 7h12v4H6z"/><path d="M9 3h6v4H9z"/><path d="M12 14v4"/></svg><span>Histórico do Mel</span></a>
        <a id="nav_configuracoes" class="nav-link active" href="configuracoes.html"><svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg><span>Configurações</span></a>
      </nav>

      <div class="side-foot"></div>
      <a class="nav-link logout-link" href="../index.html">
        <svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span>Sair</span>
      </a>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="title-line">
          <h2 id="titulo_pagina">Configurações das métricas</h2>
        </div>

        <div class="top-actions">
          <div class="avatar">T</div>
        </div>
      </header>

      <div class="grid settings-grid">
        <article class="card">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
            <h2 class="section-title" style="margin:0">Temperatura interna</h2>
            <span class="kpi-detalhe-tag"><svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 14.76V4.5a2 2 0 0 0-4 0v10.26a4 4 0 1 0 4 0z"/></svg></span>
          </div>
          <p class="section-sub">Faixas térmicas recomendadas e limites para emissão de alertas</p>
          <div class="field">
            <label for="input_temp_min">Temperatura mínima ideal (°C)</label>
            <input id="input_temp_min" type="number" value="33.0" step="0.5">
          </div>
          <div class="field">
            <label for="input_temp_max">Temperatura máxima ideal (°C)</label>
            <input id="input_temp_max" type="number" value="36.0" step="0.5">
          </div>
          <div class="field">
            <label for="input_temp_frio">Alerta de frio abaixo de (°C)</label>
            <input id="input_temp_frio" type="number" value="32.0" step="0.5">
          </div>
          <div class="field">
            <label for="input_temp_calor">Alerta de calor acima de (°C)</label>
            <input id="input_temp_calor" type="number" value="38.0" step="0.5">
          </div>
        </article>

        <article class="card">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
            <h2 class="section-title" style="margin:0">Umidade interna</h2>
            <span class="kpi-detalhe-tag"><svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.7s-6 6.4-6 11.3a6 6 0 0 0 12 0c0-4.9-6-11.3-6-11.3z"/></svg></span>
          </div>
          <p class="section-sub">Faixas de umidade relativa recomendadas e limites de segurança</p>
          <div class="field">
            <label for="input_umid_min">Umidade mínima ideal (%)</label>
            <input id="input_umid_min" type="number" value="50" min="0" max="100">
          </div>
          <div class="field">
            <label for="input_umid_max">Umidade máxima ideal (%)</label>
            <input id="input_umid_max" type="number" value="75" min="0" max="100">
          </div>
          <div class="field">
            <label for="input_umid_seca">Alerta de ar seco abaixo de (%)</label>
            <input id="input_umid_seca" type="number" value="40" min="0" max="100">
          </div>
          <div class="field">
            <label for="input_umid_umida">Alerta de umidade excessiva acima de (%)</label>
            <input id="input_umid_umida" type="number" value="85" min="0" max="100">
          </div>
        </article>
      </div>

      <div class="settings-actions">
        <button type="button" class="secondary-btn" onclick="restaurarPadrao()">Restaurar padrão</button>
        <button type="button" class="primary-btn" onclick="salvarConfiguracoes()">Salvar configurações</button>
      </div>

    </main>
  </div>

  <script>
    var idEndereco = sessionStorage.getItem("ID_ENDERECO");

    fetch('/dashboard/config/' + idEndereco)
    .then(function(resposta){
      if(resposta.status == 200){
        resposta.json().then(function(config){
          input_temp_min.value = config.temp_min_ideal;
          input_temp_max.value = config.temp_max_ideal;
          input_temp_frio.value = config.temp_alerta_frio;
          input_temp_calor.value = config.temp_alerta_calor;
          input_umid_min.value = config.umid_min_ideal;
          input_umid_max.value = config.umid_max_ideal;
          input_umid_seca.value = config.umid_alerta_seco;
          input_umid_umida.value = config.umid_alerta_excessiva;
        })
      }
    })
    .catch(function(erro){
      console.log(erro);
    })

    function salvarConfiguracoes() {
      var tempMin = Number(input_temp_min.value);
      var tempMax = Number(input_temp_max.value);
      var tempFrio = Number(input_temp_frio.value);
      var tempCalor = Number(input_temp_calor.value);
      var umidMin = Number(input_umid_min.value);
      var umidMax = Number(input_umid_max.value);
      var umidSeca = Number(input_umid_seca.value);
      var umidUmida = Number(input_umid_umida.value);

      if (input_temp_min.value == "" || input_temp_max.value == "" || input_temp_frio.value == "" || input_temp_calor.value == "" ||
          input_umid_min.value == "" || input_umid_max.value == "" || input_umid_seca.value == "" || input_umid_umida.value == "") {
        alert("Preencha todos os campos!");
        return;
      }
      if (tempMin >= tempMax) {
        alert("A temperatura mínima deve ser menor que a máxima!");
        return;
      }
      if (tempFrio >= tempMin) {
        alert("O alerta de frio deve ser menor que a temperatura mínima!");
        return;
      }
      if (tempCalor <= tempMax) {
        alert("O alerta de calor deve ser maior que a temperatura máxima!");
        return;
      }
      if (umidMin >= umidMax) {
        alert("A umidade mínima deve ser menor que a máxima!");
        return;
      }
      if (umidSeca >= umidMin) {
        alert("O alerta de ar seco deve ser menor que a umidade mínima!");
        return;
      }
      if (umidUmida <= umidMax) {
        alert("O alerta de umidade excessiva deve ser maior que a umidade máxima!");
        return;
      }
      if (umidSeca < 0 || umidUmida > 100) {
        alert("A umidade deve ficar entre 0% e 100%!");
        return;
      }

      fetch('/dashboard/config', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json'},
        body: JSON.stringify({
          idEndereco: idEndereco,
          TempMin: tempMin, TempMax: tempMax, AlertaFrio: tempFrio, AlertaCalor: tempCalor,
          UmiMin: umidMin, UmiMax: umidMax, AlertaSeco: umidSeca, AlertaUmi: umidUmida
        })
      })
      .then(function(resposta){
        if(resposta.ok){
          localStorage.setItem("tetria_configuracoes", JSON.stringify({
            tempMin: tempMin, tempMax: tempMax, tempFrio: tempFrio, tempCalor: tempCalor,
            umidMin: umidMin, umidMax: umidMax, umidSeca: umidSeca, umidRisco: umidUmida
          }));
          alert('Configurações salvas!')
        }
        else{
          alert('Erro ao salvar')
        }
      })
      .catch(function(erro){
        console.log(erro);
      })
    }

    function restaurarPadrao() {
      fetch('/dashboard/config', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json'},
        body: JSON.stringify({
          idEndereco: idEndereco,
          TempMin: 33, TempMax: 36, AlertaFrio: 32, AlertaCalor: 38,
          UmiMin: 50, UmiMax: 75, AlertaSeco: 40, AlertaUmi: 85
        })
      })
      .then(function(resposta){
        if(resposta.ok){
          input_temp_min.value = 33;
          input_temp_max.value = 36;
          input_temp_frio.value = 32;
          input_temp_calor.value = 38;
          input_umid_min.value = 50;
          input_umid_max.value = 75;
          input_umid_seca.value = 40;
          input_umid_umida.value = 85;
          localStorage.removeItem("tetria_configuracoes");
          alert('Configurações de volta ao padrão!')
        }
        else{
          alert('Erro ao restaurar')
        }
      })
      .catch(function(erro){
        console.log(erro);
      })
    }
  </script>
</body>

</html>
